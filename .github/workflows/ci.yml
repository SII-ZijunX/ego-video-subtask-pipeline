name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: pip install -e ".[dev]"
      - name: Compile and test
        run: |
          python -m compileall -q video_annotation_pipeline
          pytest
          ego-video-pipeline --help
          ego-video-long --help
      - name: CPU mock smoke
        run: bash examples/run_mock.sh /tmp/ego-video-subtask-demo
      - name: Reject generated data artifacts
        run: |
          if find . -type f \( -name '*.mp4' -o -name '*.pt' -o -name '*.pth' -o -name '*.safetensors' -o -name '*.log' \) -print -quit | grep -q .; then
            echo "Generated data/model artifact found in repository"
            exit 1
          fi
