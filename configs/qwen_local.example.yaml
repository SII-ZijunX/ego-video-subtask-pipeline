project:
  schema_version: "0.1"
  output_dir: outputs/qwen_local

backend:
  type: qwen_local
  model: Qwen3-VL-32B-Instruct
  model_path: /path/to/Qwen3-VL-32B-Instruct
  base_url: null
  api_key_env: VLM_API_KEY
  timeout_sec: 300
  max_retries: 2
  temperature: 0.0
  max_new_tokens: 1536
  attn_implementation: null

sampling:
  fps: 1.0
  max_frames: 40
  resize_long_side: 448
  multi_view_layout: grid

segmentation:
  # Analysis-window candidates may be short. Final exported clips are still
  # forced to >=3 seconds by `ego-video-long finalize`.
  min_subtask_duration_sec: 1.0
  max_subtasks_per_minute: 30
  sustained_pause_sec: 1.5

validation:
  continuity_tolerance_sec: 0.25
  max_uncovered_gap_sec: 2.0
  max_multiview_duration_diff_sec: 0.5
  minimum_video_duration_sec: 3.0
  reject_idle_only: true
  warn_other_ratio: 0.3
  minimum_coverage_ratio: 0.7

output:
  save_raw_response: true
  save_sampled_frames: true
  save_prompt: true
  generate_html: true

prompt_version: ego_video_long_window_v1_qwen_visual_only
